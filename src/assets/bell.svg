<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 250" width="220" height="250" role="img" aria-label="Cut-out of a service bell with a support ticket tucked beneath it">
  <title>Service bell with a support ticket</title>
  <g fill="none" stroke="#141C2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- bell button -->
    <path d="M110 60 V40" />
    <circle cx="110" cy="33" r="9" />
    <!-- dome -->
    <path d="M52 148 C52 100 78 66 110 66 C142 66 168 100 168 148" />
    <!-- rim -->
    <path d="M40 148 H180" />
    <path d="M52 148 C64 138 156 138 168 148" />
    <!-- base plate -->
    <path d="M40 148 V162 H180 V148" />
    <!-- foot -->
    <path d="M40 162 L28 200 H192 L180 162" />
    <path d="M28 200 H192" />
    <!-- striker -->
    <path d="M110 200 V214" />
    <circle cx="110" cy="223" r="8" />
  </g>

  <!-- ticket tucked under the bell, on the paper ground -->
  <g transform="rotate(-7 150 178)">
    <rect x="132" y="150" width="86" height="58" fill="#EFE9DD" stroke="#141C2B" stroke-width="3" />
    <g stroke="#141C2B" stroke-width="2.4" stroke-linecap="round">
      <path d="M142 166 H204" />
      <path d="M142 178 H186" />
      <path d="M142 190 H172" />
    </g>
    <!-- the one accent rule -->
    <path d="M142 158 H174" stroke="#2C4A8F" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>